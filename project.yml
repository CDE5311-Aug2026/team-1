name: SinglishDaily
options:
  bundleIdPrefix: com.wsamme
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
targets:
  SinglishDaily:
    type: application
    platform: iOS
    sources:
      - SinglishDaily
    info:
      path: SinglishDaily/Info.plist
      properties:
        UIAppFonts: [Inter.ttf]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wsamme.SinglishDaily
        INFOPLIST_KEY_CFBundleDisplayName: Singlish Daily
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UIAppFonts:
          - Inter.ttf
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  SinglishDailyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SinglishDailyTests]
    dependencies:
      - target: SinglishDaily
  SinglishDailyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SinglishDailyUITests]
    dependencies:
      - target: SinglishDaily
schemes:
  SinglishDaily:
    build:
      targets:
        SinglishDaily: all
    test:
      targets: [SinglishDailyTests, SinglishDailyUITests]
